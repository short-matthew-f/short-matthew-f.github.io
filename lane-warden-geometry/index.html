<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lane Warden Geometry Test</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09101a;color:#eef3f8;font-family:system-ui,-apple-system,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.p{position:fixed;z-index:3;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));background:#0b111de8;border:1px solid #ffffff24;border-radius:15px;overflow:hidden;width:min(340px,calc(100% - 20px))}.bar{height:56px;display:flex;align-items:center;padding:8px 10px;gap:8px;font-weight:750}.bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toggle{width:40px;height:40px;border-radius:10px;font-size:24px}.body{padding:0 10px 10px}.p.closed{width:190px}.p.closed .body{display:none}button{background:#172237;color:#fff;border:1px solid #ffffff26;border-radius:9px;padding:8px 10px;font-weight:650}button.on{background:#9f6926;border-color:#e5ad58}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.hint{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));background:#0b111dcc;border:1px solid #ffffff1c;border-radius:999px;padding:6px 10px;font-size:11px;white-space:nowrap}.stat{position:fixed;z-index:2;right:10px;top:10px;background:#0b111dcc;border:1px solid #ffffff1c;border-radius:999px;padding:7px 10px;font-size:12px}@media(max-width:700px){.p{width:280px}.p.closed{width:170px}.stat{top:auto;bottom:48px}}</style>
<canvas id="c"></canvas><div id="panel" class="p closed"><div class="bar"><span>Geometry test 02</span><button id="toggle" class="toggle">+</button></div><div class="body"><div class="row"><button data-map="plain" class="on">Plain</button><button data-map="long">Long / Short</button><button data-map="ladder">Ladder</button></div><div class="row"><button id="wave">Spawn waves</button><button id="pads" class="on">Tower pads</button><button id="spread" class="on">Formation spread</button></div></div></div><div id="stat" class="stat">Plain · Commander middle</div><div class="hint">Tap a lane to rotate the Commander · geometry test 02</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=2,map='plain',showPads=true,spread=true,commLane=1,comm={x:.42,z:1},units=[],last=0;
const maps={plain:{name:'Plain',lanes:[[[.08,.22],[.92,.22]],[[.08,.50],[.92,.50]],[[.08,.78],[.92,.78]]],j:[{x:.35,a:0,b:2},{x:.68,a:0,b:2}]},long:{name:'Long / Short',lanes:[[[.08,.22],[.92,.22]],[[.08,.50],[.35,.50],[.50,.47],[.65,.53],[.92,.50]],[[.08,.78],[.28,.78],[.40,.84],[.60,.84],[.72,.78],[.92,.78]]],j:[{x:.36,a:0,b:1},{x:.69,a:1,b:2}]},ladder:{name:'Ladder',lanes:[[[.08,.22],[.92,.22]],[[.08,.50],[.92,.50]],[[.08,.78],[.92,.78]]],j:[{x:.35,a:0,b:1},{x:.68,a:1,b:2}]}};
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function lerp(a,b,t){return a+(b-a)*t}function lanePoint(l,t){const pts=maps[map].lanes[l],lens=[],tot=0;for(let i=0;i<pts.length-1;i++){let q=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);lens.push(q);tot+=q}let d=t*tot;for(let i=0;i<lens.length;i++){if(d<=lens[i]){let q=d/lens[i];return[lerp(pts[i][0],pts[i+1][0],q),lerp(pts[i][1],pts[i+1][1],q)]}d-=lens[i]}return pts.at(-1)}
function px(p){return[p[0]*W,p[1]*H]}function roundedRect(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a-w/2,b-h/2,w,h,r);x.fill()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#708069';x.fillRect(0,0,W,H);const M=maps[map];
 // lanes
 M.lanes.forEach((pts,li)=>{x.strokeStyle='#d9ceb5';x.lineWidth=Math.max(54,H*.095);x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach((p,i)=>{let q=px(p);i?x.lineTo(...q):x.moveTo(...q)});x.stroke();x.strokeStyle='#a99f89';x.lineWidth=2;x.stroke()});
 // junction plazas
 M.j.forEach(j=>{let y1=[.22,.50,.78][j.a]*H,y2=[.22,.50,.78][j.b]*H,xx=j.x*W;x.fillStyle='#4bcbb044';x.fillRect(xx-Math.max(30,W*.025),Math.min(y1,y2)-35,Math.max(60,W*.05),Math.abs(y2-y1)+70);for(let k=j.a;k<=j.b;k++){x.beginPath();x.fillStyle='#4bcbb077';x.arc(xx,[.22,.50,.78][k]*H,Math.max(24,W*.022),0,7);x.fill()}});
 // pads shoulder-mounted
 if(showPads){for(let l=0;l<3;l++){for(let i=0;i<2;i++){let p=lanePoint(l,i?0.55:0.25),q=px(p),off=(l%2?1:-1)*Math.max(45,H*.055);x.beginPath();x.fillStyle='#8ca2ba';x.arc(q[0],q[1]+off,Math.max(24,W*.021),0,7);x.fill();x.strokeStyle='#c7d4e2';x.lineWidth=3;x.stroke()}}}
 // Bastions and Guards spanning route
 for(let l=0;l<3;l++){let yy=[.22,.50,.78][l]*H;roundedRect(.075*W,yy,Math.max(48,W*.038),Math.max(70,H*.10),8,'#374252');roundedRect(.075*W,yy,Math.max(38,W*.030),Math.max(22,H*.028),5,'#f1aa3d');roundedRect(.91*W,yy,Math.max(48,W*.038),Math.max(70,H*.10),8,'#374252');roundedRect(.91*W,yy,Math.max(38,W*.030),Math.max(22,H*.028),5,'#f14f69')}
 roundedRect(.965*W,.50*H,Math.max(55,W*.045),H*.55,8,'#4a342d');
 // units
 units.forEach(u=>{let p=lanePoint(u.lane,u.t),q=px(p),off=spread?u.off*H:0,qy=q[1]+off;u.team==='f'?u.t+=u.v:u.t-=u.v;if(u.t>1.05||u.t<-.05)u.dead=true;let col=u.team==='f'?'#f1aa3d':'#f14f69';if(u.type==='siege')roundedRect(q[0],qy,Math.max(28,W*.022),Math.max(20,H*.026),5,col);else{x.fillStyle=col;x.beginPath();x.arc(q[0],qy,u.type==='heavy'?Math.max(11,W*.009):Math.max(8,W*.0065),0,7);x.fill();if(u.type==='ranged'){x.strokeStyle='#26303c';x.lineWidth=3;x.beginPath();x.moveTo(q[0],qy-15);x.lineTo(q[0],qy+15);x.stroke()}}});units=units.filter(u=>!u.dead);
 // commander
 let cp=lanePoint(commLane,comm.x),cq=px(cp);x.beginPath();x.strokeStyle='#4bd1b5';x.lineWidth=5;x.arc(cq[0],cq[1],Math.max(20,W*.017),0,7);x.stroke();x.fillStyle='#f1aa3d';x.beginPath();x.arc(cq[0],cq[1],Math.max(12,W*.010),0,7);x.fill();
 requestAnimationFrame(draw)}
function spawn(){for(let l=0;l<3;l++)for(let i=0;i<5;i++){units.push({team:'f',lane:l,t:.10-i*.025,v:.0007+Math.random()*.00025,off:((i%3)-1)*.018,type:i===4?'siege':i===2?'ranged':i===0?'heavy':'mob'});units.push({team:'e',lane:l,t:.90+i*.025,v:.0007+Math.random()*.00025,off:((i%3)-1)*.018,type:i===4?'siege':i===2?'ranged':i===0?'heavy':'mob'})}}
spawn();draw();
document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{map=b.dataset.map;commLane=1;comm.x=.42;units=[];spawn();document.querySelectorAll('[data-map]').forEach(q=>q.classList.toggle('on',q===b));document.getElementById('stat').textContent=maps[map].name+' · Commander middle'});document.getElementById('wave').onclick=spawn;document.getElementById('pads').onclick=e=>{showPads=!showPads;e.target.classList.toggle('on',showPads)};document.getElementById('spread').onclick=e=>{spread=!spread;e.target.classList.toggle('on',spread)};document.getElementById('toggle').onclick=e=>{let p=document.getElementById('panel');p.classList.toggle('closed');e.target.textContent=p.classList.contains('closed')?'+':'−'};
c.addEventListener('pointerdown',e=>{if(e.clientY<130&&e.clientX<380)return;let n=e.clientY/H,b=[.22,.50,.78].map(v=>Math.abs(v-n)),li=b.indexOf(Math.min(...b));commLane=li;document.getElementById('stat').textContent=maps[map].name+' · Commander '+['top','middle','bottom'][li]});
</script>
