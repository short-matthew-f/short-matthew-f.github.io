<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lane Warden — Crowd Readability Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090d14;color:#edf3f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:absolute;z-index:5;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:min(355px,calc(100% - 20px));background:rgba(8,12,20,.90);border:1px solid rgba(255,255,255,.14);border-radius:15px;backdrop-filter:blur(10px);overflow:hidden}.bar{height:58px;display:flex;align-items:center;gap:8px;padding:9px 10px}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.collapse{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#182235;color:white;font-size:25px;font-weight:700}.body{padding:0 10px 11px}.panel.collapsed{width:225px}.panel.collapsed .body{display:none}.panel.collapsed .bar{height:58px}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.row:first-child{margin-top:0}button{appearance:none;border:1px solid rgba(255,255,255,.16);background:#172135;color:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-weight:650}button.active{background:#9f6926;border-color:#e5ad58}.mini{font-size:12px;color:#aeb9c7;line-height:1.35;margin-top:8px}.check{font-size:12px;display:flex;align-items:center;gap:6px;color:#d6dee7}.stats{position:absolute;z-index:4;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:7px}.chip{background:rgba(8,12,20,.82);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 10px;font-size:12px;backdrop-filter:blur(8px)}.hint{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));background:rgba(8,12,20,.78);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 10px;font-size:11px;white-space:nowrap}.legend{position:absolute;z-index:4;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));background:rgba(8,12,20,.78);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.5}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.friendly{background:#f0a83b}.enemy{background:#f14f69}.commander{background:#54d6bd}
@media(max-width:700px){.panel{width:285px}.panel.collapsed{width:170px}.stats{top:auto;bottom:10px;right:10px}.legend{display:none}.hint{bottom:52px}.mini{display:none}button{font-size:12px;padding:7px 8px}}
</style>
</head>
<body>
<div id="app">
  <div id="panel" class="panel collapsed">
    <div class="bar"><div class="title">Crowd readability</div><button id="collapse" class="collapse" aria-label="Expand controls">+</button></div>
    <div class="body">
      <div class="row"><button data-density="low">Low · 18</button><button data-density="target" class="active">Target · 42</button><button data-density="stress">Stress · 90</button></div>
      <div class="row"><button id="reset">Reset battle</button><button id="camera">Camera: near-overhead</button></div>
      <div class="row"><label class="check"><input id="health" type="checkbox" checked> health bars</label><label class="check"><input id="shots" type="checkbox" checked> projectiles</label><label class="check"><input id="spread" type="checkbox" checked> formation spread</label></div>
      <div class="mini">Purpose: find the point where unit silhouettes, Commander position, health, and lane state stop being readable at actual phone scale.</div>
    </div>
  </div>
  <div class="stats"><div id="fps" class="chip">— fps</div><div id="count" class="chip">0 actors</div></div>
  <div class="hint">Lane Warden · crowd test 01</div>
  <div class="legend"><div><span class="dot friendly"></span>friendly</div><div><span class="dot enemy"></span>enemy</div><div><span class="dot commander"></span>Commander aura</div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';

const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; app.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1018);
const camera=new THREE.OrthographicCamera(); let oblique=false;
function setCamera(){const a=innerWidth/innerHeight,h=7.15;camera.left=-h*a;camera.right=h*a;camera.top=h;camera.bottom=-h;camera.near=.1;camera.far=80;if(oblique){camera.position.set(0,17.5,8.5)}else{camera.position.set(0,24,.01)}camera.lookAt(0,0,0);camera.updateProjectionMatrix()}setCamera();
scene.add(new THREE.HemisphereLight(0xbfd5ed,0x33291f,2.5)); const sun=new THREE.DirectionalLight(0xffefd0,2.25);sun.position.set(-8,15,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);

const LANE_Z=[-4,0,4], HALF_W=1.35;
const board=new THREE.Mesh(new THREE.PlaneGeometry(28,14),new THREE.MeshStandardMaterial({color:0x65705d,roughness:1}));board.rotation.x=-Math.PI/2;board.position.y=-.06;board.receiveShadow=true;scene.add(board);
for(const z of LANE_Z){const lane=new THREE.Mesh(new THREE.PlaneGeometry(24,2.45),new THREE.MeshStandardMaterial({color:0xb2aa91,roughness:1}));lane.rotation.x=-Math.PI/2;lane.position.set(0,-.035,z);lane.receiveShadow=true;scene.add(lane);for(const x of [-4,4]){const pad=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.07,24),new THREE.MeshStandardMaterial({color:0x788da3,roughness:.85}));pad.position.set(x,.02,z);scene.add(pad)}}
for(const x of [-7.3,7.3])for(const z of LANE_Z){const b=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,1.7),new THREE.MeshStandardMaterial({color:x<0?0xd89b3b:0xd64b63,roughness:.8}));b.position.set(x,.6,z);b.castShadow=true;scene.add(b)}

const M={dark:new THREE.MeshStandardMaterial({color:0x28313c,roughness:.85}),steel:new THREE.MeshStandardMaterial({color:0x718092,metalness:.35,roughness:.45}),bone:new THREE.MeshStandardMaterial({color:0xd8d0b9,roughness:.8}),wood:new THREE.MeshStandardMaterial({color:0x604635,roughness:.9})};
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.72})}function mesh(g,m){const x=new THREE.Mesh(g,m);x.castShadow=true;x.receiveShadow=true;return x}
function heavy(color){const root=new THREE.Group(),t=mat(color);const torso=mesh(new THREE.BoxGeometry(.58,.66,.48),M.dark);torso.position.y=1;root.add(torso);const sh=mesh(new THREE.BoxGeometry(1.02,.22,.6),t);sh.position.y=1.36;root.add(sh);const head=mesh(new THREE.CylinderGeometry(.22,.25,.32,8),M.steel);head.position.y=1.66;root.add(head);const shield=mesh(new THREE.BoxGeometry(.12,.86,.7),M.steel);shield.position.set(-.48,.93,0);root.add(shield);const sword=mesh(new THREE.BoxGeometry(.1,.9,.12),M.steel);sword.position.set(.5,.78,0);sword.rotation.z=-.25;root.add(sword);for(const sx of [-.19,.19]){const leg=mesh(new THREE.BoxGeometry(.18,.65,.2),M.dark);leg.position.set(sx,.33,0);root.add(leg)}root.userData.kind='heavy';return root}
function ranger(color){const root=new THREE.Group(),t=mat(color);const body=mesh(new THREE.BoxGeometry(.38,.67,.34),M.dark);body.position.y=.9;root.add(body);const hood=mesh(new THREE.ConeGeometry(.27,.42,7),t);hood.position.y=1.43;root.add(hood);const bow=new THREE.Group();const limb=mesh(new THREE.TorusGeometry(.42,.035,6,18,Math.PI),M.wood);limb.rotation.z=Math.PI/2;bow.add(limb);const string=mesh(new THREE.BoxGeometry(.03,.78,.03),M.bone);bow.add(string);bow.position.set(.45,1.02,0);root.add(bow);for(const sx of [-.13,.13]){const leg=mesh(new THREE.BoxGeometry(.14,.56,.17),M.dark);leg.position.set(sx,.3,0);root.add(leg)}root.userData.kind='ranger';return root}
function ram(color){const root=new THREE.Group(),t=mat(color);const body=mesh(new THREE.BoxGeometry(1.18,.55,.82),M.wood);body.position.y=.55;root.add(body);const beam=mesh(new THREE.BoxGeometry(1.72,.18,.20),M.dark);beam.position.set(.55,.78,0);root.add(beam);const nose=mesh(new THREE.ConeGeometry(.18,.38,6),M.steel);nose.rotation.z=-Math.PI/2;nose.position.set(1.56,.78,0);root.add(nose);for(const x of [-.37,.37])for(const z of [-.46,.46]){const w=mesh(new THREE.CylinderGeometry(.13,.13,.12,10),M.dark);w.rotation.x=Math.PI/2;w.position.set(x,.25,z);root.add(w)}const flag=mesh(new THREE.BoxGeometry(.06,.64,.06),M.dark);flag.position.set(-.45,1.16,0);root.add(flag);const penn=mesh(new THREE.BoxGeometry(.42,.24,.05),t);penn.position.set(-.25,1.38,0);root.add(penn);root.userData.kind='ram';return root}
function commander(color){const r=heavy(color);r.scale.setScalar(1.28);const crest=mesh(new THREE.BoxGeometry(.16,.32,.55),mat(0x54d6bd));crest.position.set(0,1.94,0);r.add(crest);r.userData.kind='commander';return r}

const actors=[],projectiles=[];let showHealth=true,showShots=true,spread=true,density='target';
function teamColor(team){return team==='f'?0xf0a83b:0xf14f69}
function addHealth(a){const g=new THREE.Group();const bg=new THREE.Mesh(new THREE.PlaneGeometry(.75,.11),new THREE.MeshBasicMaterial({color:0x161b22,side:THREE.DoubleSide}));const fg=new THREE.Mesh(new THREE.PlaneGeometry(.71,.07),new THREE.MeshBasicMaterial({color:a.team==='f'?0xf0a83b:0xf14f69,side:THREE.DoubleSide}));fg.position.y=.003;g.add(bg,fg);g.rotation.x=-Math.PI/2;g.position.y=2.15;a.root.add(g);a.bar={g,fg};}
function actor(type,team,lane,index,total){let r=type==='heavy'?heavy(teamColor(team)):type==='ranger'?ranger(teamColor(team)):type==='ram'?ram(teamColor(team)):commander(0xf0a83b);if(type==='ram')r.scale.setScalar(.92);const root=new THREE.Group();root.add(r);const zoff=spread?(((index%5)-2)*.29 + (Math.floor(index/5)%2)*.13):0;const dir=team==='f'?1:-1;root.position.set(team==='f'?-9.6:9.6,0,LANE_Z[lane]+zoff);root.rotation.y=dir===1?Math.PI/2:-Math.PI/2;scene.add(root);const a={root,visual:r,type,team,lane,hp:type==='ram'?170:type==='heavy'?110:type==='commander'?260:72,max:0,speed:type==='ram'?.52:type==='heavy'?.78:type==='commander'?1.0:.7,range:type==='ranger'?2.0:type==='commander'?.72:.58,cd:Math.random()*.7,dead:false};a.max=a.hp;if(type==='commander'){const aura=new THREE.Mesh(new THREE.RingGeometry(1.45,1.55,42),new THREE.MeshBasicMaterial({color:0x54d6bd,transparent:true,opacity:.36,side:THREE.DoubleSide,depthWrite:false}));aura.rotation.x=-Math.PI/2;aura.position.y=.025;root.add(aura)}addHealth(a);actors.push(a);return a}
function clearBattle(){for(const a of actors)scene.remove(a.root);actors.length=0;for(const p of projectiles)scene.remove(p.m);projectiles.length=0}
const presets={low:18,target:42,stress:90};
function buildBattle(){clearBattle();const n=presets[density];const perTeam=Math.floor((n-2)/2);let idx={f:[0,0,0],e:[0,0,0]};for(const team of ['f','e']){for(let i=0;i<perTeam;i++){const lane=i%3;const k=i%8===0?'ram':i%3===0?'ranger':'heavy';actor(k,team,lane,idx[team][lane]++,Math.ceil(perTeam/3));}}actor('commander','f',1,idx.f[1]++,1);actor('commander','e',1,idx.e[1]++,1);document.getElementById('count').textContent=`${actors.length} actors`;}
function nearestEnemy(a){let best=null,bd=1e9;for(const b of actors){if(b.dead||b.team===a.team||b.lane!==a.lane)continue;const d=Math.abs(b.root.position.x-a.root.position.x);if(d<bd){bd=d;best=b}}return [best,bd]}
function fire(a,b){if(!showShots)return;const m=mesh(new THREE.SphereGeometry(.07,7,5),new THREE.MeshBasicMaterial({color:teamColor(a.team)}));m.position.set(a.root.position.x,1.1,a.root.position.z);scene.add(m);projectiles.push({m,target:b,life:1.2,team:a.team})}
function damage(a,b){const dmg=a.type==='ram'?18:a.type==='heavy'?10:a.type==='commander'?16:8;b.hp-=dmg;if(b.hp<=0){b.dead=true;b.root.visible=false}else if(b.bar){b.bar.fg.scale.x=Math.max(.02,b.hp/b.max);b.bar.fg.position.x=-(1-b.hp/b.max)*.355}}
function updateActors(dt,t){for(const a of actors){if(a.dead)continue;a.bar.g.visible=showHealth;const [b,d]=nearestEnemy(a);if(!b)continue;const dir=a.team==='f'?1:-1;if(d>a.range){a.root.position.x+=dir*a.speed*dt;const walk=Math.sin(t*8+a.root.id)*.18;a.visual.rotation.z=walk*.16}else{a.visual.rotation.z=0;a.cd-=dt;if(a.cd<=0){a.cd=a.type==='ranger'?1.25:a.type==='ram'?1.55:.85;if(a.type==='ranger')fire(a,b);else damage(a,b)}}}}
function updateProjectiles(dt){for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.life-=dt;if(p.target.dead||p.life<=0){scene.remove(p.m);projectiles.splice(i,1);continue}const target=new THREE.Vector3(p.target.root.position.x,1.0,p.target.root.position.z);const delta=target.clone().sub(p.m.position);const d=delta.length();if(d<.2){damage({type:'ranger',team:p.team},p.target);scene.remove(p.m);projectiles.splice(i,1)}else p.m.position.add(delta.normalize().multiplyScalar(Math.min(d,4.2*dt)))}}

const panel=document.getElementById('panel'),collapse=document.getElementById('collapse');collapse.addEventListener('click',()=>{panel.classList.toggle('collapsed');const c=panel.classList.contains('collapsed');collapse.textContent=c?'+':'−';collapse.setAttribute('aria-label',c?'Expand controls':'Collapse controls')});
document.querySelectorAll('[data-density]').forEach(b=>b.addEventListener('click',()=>{density=b.dataset.density;document.querySelectorAll('[data-density]').forEach(x=>x.classList.toggle('active',x===b));buildBattle()}));document.getElementById('reset').addEventListener('click',buildBattle);document.getElementById('camera').addEventListener('click',e=>{oblique=!oblique;setCamera();e.currentTarget.textContent=`Camera: ${oblique?'oblique':'near-overhead'}`});document.getElementById('health').addEventListener('change',e=>showHealth=e.target.checked);document.getElementById('shots').addEventListener('change',e=>showShots=e.target.checked);document.getElementById('spread').addEventListener('change',e=>{spread=e.target.checked;buildBattle()});

let frames=0,lastFps=performance.now(),fps=0;const clock=new THREE.Clock();buildBattle();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.035),t=performance.now()/1000;updateActors(dt,t);updateProjectiles(dt);renderer.render(scene,camera);frames++;const now=performance.now();if(now-lastFps>700){fps=Math.round(frames*1000/(now-lastFps));document.getElementById('fps').textContent=`${fps} fps`;frames=0;lastFps=now}}
loop();function resize(){renderer.setSize(innerWidth,innerHeight);setCamera()}addEventListener('resize',resize);resize();
</script>
</body>
</html>
