<!DOCTYPE html>
<!-- Gravity Well — entry document. Two views (menu / play) live in one page;
     main.js swaps them. The canvas fills the viewport; bars overlay it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070f">
<meta name="description" content="Gravity Well — a deterministic space-physics puzzle. Place gravity charges, launch, and watch the field do the steering.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Gravity Well</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ------------------------------------------------------------ menu view -->
<section id="view-menu" class="view" aria-label="Level select">
  <header class="menu-head">
    <h1>Gravity&nbsp;Well</h1>
    <p class="tagline">Your engine is dead. Bend space instead.</p>
    <button id="btn-packs" class="pack-bar" type="button" aria-haspopup="dialog">
      <span class="pack-label">Pack</span>
      <span id="pack-name" class="pack-name">Gravity Well</span>
      <span class="pack-caret" aria-hidden="true">&#9662;</span>
    </button>
  </header>
  <div id="menu-list" class="menu-list"></div>
  <footer class="menu-foot">
    <a id="btn-editor" class="btn btn-ghost" href="editor.html">Level editor</a>
    <button id="btn-reset-progress" class="btn btn-ghost" type="button">Reset progress</button>
    <button id="btn-install" class="btn btn-ghost" type="button" style="margin-left:10px" hidden>Install</button>
  </footer>

  <!-- pack picker -->
  <div id="packs" class="overlay" hidden role="dialog" aria-label="Level packs">
    <div class="result-card">
      <h2>Level packs</h2>
      <div id="packs-list" class="packs-list"></div>
      <div class="result-actions">
        <button id="btn-import-pack" class="btn" type="button">Import pack</button>
        <button id="btn-packs-close" class="btn btn-ghost" type="button">Close</button>
      </div>
    </div>
  </div>

  <!-- import pack -->
  <div id="import" class="overlay" hidden role="dialog" aria-label="Import pack">
    <div class="result-card">
      <h2>Import pack</h2>
      <p class="result-body">Paste pack JSON below, or choose a <code>.json</code> file.</p>
      <textarea id="import-text" class="import-text" rows="6" spellcheck="false"
        placeholder='{"format":"gw-pack-1", ...}'></textarea>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <p id="import-msg" class="import-msg" hidden></p>
      <div class="result-actions">
        <button id="btn-import-file" class="btn" type="button">Choose file</button>
        <button id="btn-import-cancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="btn-import-go" class="btn btn-primary" type="button">Import</button>
      </div>
    </div>
  </div>
</section>

<!-- ------------------------------------------------------------ play view -->
<section id="view-play" class="view" aria-label="Mission" hidden>
  <canvas id="game"></canvas>

  <div id="topbar" class="bar bar-top">
    <button id="btn-menu" class="btn btn-icon" type="button" aria-label="Back to level select">&#8249;</button>
    <a id="btn-back-editor" class="btn btn-ghost btn-small" href="editor.html" hidden>Editor</a>
    <div class="top-mid">
      <div id="level-name" class="level-name">&nbsp;</div>
      <div id="closest" class="closest" hidden></div>
    </div>
    <div id="charges" class="charges" title="Charges used of budget"><span class="chg-label">chg</span><span id="charges-used">0</span><span class="sep">/</span><span id="charges-budget">0</span></div>
  </div>

  <div id="radio" class="radio-card" hidden role="status">
    <div class="radio-head">
      <span class="radio-dot"></span><span class="radio-who">MISSION CONTROL</span>
    </div>
    <p id="radio-text" class="radio-text"></p>
  </div>

  <div id="bottombar" class="bar bar-bottom">
    <div id="plan-controls" class="controls">
      <button id="btn-reset" class="btn" type="button">Reset</button>
      <button id="btn-paste" class="btn btn-ghost" type="button">Paste</button>
      <button id="btn-launch" class="btn btn-primary" type="button">Launch</button>
    </div>
    <div id="flight-controls" class="controls" hidden>
      <button id="btn-abort" class="btn" type="button">Abort</button>
      <div id="flight-time" class="flight-time">0.0s</div>
      <button id="btn-speed" class="btn" type="button">1&times;</button>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="result-card">
      <h2 id="result-title">Target reached</h2>
      <p id="result-body" class="result-body"></p>
      <p id="result-bonus" class="result-bonus" hidden></p>
      <div class="result-actions">
        <button id="btn-adjust" class="btn" type="button">Adjust</button>
        <button id="btn-copy" class="btn btn-ghost" type="button">Copy solution</button>
        <button id="btn-next" class="btn btn-primary" type="button" hidden>Next level</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
