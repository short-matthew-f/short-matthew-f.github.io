<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity Well — hot-zone explorer (dev)</title>
<style>
  :root {
    --bg: #05070f;
    --panel: #0c1120;
    --line: #1d2b4a;
    --text: #dfe7ff;
    --dim: #8ea0c8;
    --accent: #9b6cff;
    --good: #7CF6B0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 8px 0 0;
    color: var(--accent);
  }
  label { color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
  select, button, input[type=range] {
    font: inherit;
    color: var(--text);
    background: #121a30;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 8px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  #stage { flex: 1 1 auto; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  aside {
    flex: 0 0 300px;
    border-left: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 14px;
    overflow: auto;
  }
  aside h2 {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 6px;
  }
  aside section { margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 2px 4px; text-align: right; border-bottom: 1px solid rgba(29,43,74,0.6); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; }
  .good { color: var(--good); }
  .bad { color: #ff6b6b; }
  .note { color: var(--dim); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
  @media (max-width: 820px) {
    main { flex-direction: column; }
    aside { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
    #stage { flex: 1 1 55vh; }
  }
</style>
</head>
<body>
  <header>
    <h1>Hot zone</h1>
    <label>Level <select id="level"></select></label>
    <label>Charges <input id="charges" type="range" min="1" max="3" value="1" step="1"><span id="chargesOut">1</span></label>
    <label>Step <select id="step">
      <option>8</option><option selected>12</option><option>16</option><option>20</option><option>24</option>
    </select></label>
    <button id="sweep">Sweep</button>
    <button id="stop" disabled>Stop</button>
    <span id="status" class="note"></span>
  </header>
  <main>
    <div id="stage"><canvas id="cv"></canvas></div>
    <aside>
      <section>
        <h2>Legend</h2>
        <div><span class="swatch" style="background:rgba(90,240,150,0.55)"></span>well here wins</div>
        <div><span class="swatch" style="background:rgba(255,90,90,0.30)"></span>well here fails</div>
        <div><span class="swatch" style="background:rgba(150,160,190,0.35)"></span>skipped (obstacle / ship / target)</div>
        <div class="note" style="margin-top:6px">Rings = authored solution wells.</div>
      </section>
      <section>
        <h2>Level</h2>
        <div id="levelInfo"></div>
      </section>
      <section>
        <h2>Sweep metrics</h2>
        <table id="metrics"><tbody></tbody></table>
      </section>
      <section>
        <h2>Authored solution</h2>
        <div id="solution"></div>
      </section>
    </aside>
  </main>
  <script type="module" src="./hotzone-page.js"></script>
</body>
</html>
