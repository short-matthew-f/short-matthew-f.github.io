<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lane Warden — 3D Pathing Mockup</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#0b0e16;color:#eef3f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #app{position:relative;width:100%;height:100%}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .panel{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:min(330px,calc(100% - 24px));padding:12px;border-radius:14px;background:rgba(9,12,20,.82);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
    h1{font-size:16px;margin:0 0 6px;font-weight:700}
    .sub{font-size:12px;color:#aeb8c5;margin-bottom:10px;line-height:1.35}
    .row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}
    button,select,input{font:inherit}
    button{appearance:none;border:1px solid rgba(255,255,255,.18);background:#1a2233;color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:650}
    button:hover{background:#263149}
    button.active{background:#b97a2e;border-color:#e6b35e}
    label{font-size:12px;color:#c9d2dc;display:flex;align-items:center;gap:7px}
    input[type=range]{width:125px}
    .status{font-size:11px;line-height:1.4;color:#9fb0c1;margin-top:8px}
    .legend{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));background:rgba(9,12,20,.78);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 11px;font-size:11px;color:#ccd5df;backdrop-filter:blur(8px)}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.amber{background:#f2a93b}.rose{background:#f2506b}.teal{background:#46c8b0}
    .hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;font-size:11px;color:#eef3f7;background:rgba(9,12,20,.68);padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.1)}
    @media (max-width:650px){.panel{width:260px;padding:9px}.sub,.status{display:none}button{padding:6px 8px;font-size:12px}.legend{display:none}}
  </style>
</head>
<body>
<div id="app">
  <div class="panel">
    <h1>Lane Warden — 3D pathing proof</h1>
    <div class="sub">Actual CC0 rigged fantasy models moving over a three-lane battle board. Tap a lane in the scene or use the lane buttons to redirect the Commander.</div>
    <div class="row"><button data-lane="0">Commander → Top</button><button data-lane="1" class="active">Commander → Mid</button><button data-lane="2">Commander → Bottom</button></div>
    <div class="row"><button id="wave">Spawn friendly wave</button><button id="enemy">Spawn enemy wave</button><button id="camera">Camera: oblique</button></div>
    <div class="row"><label>Speed <input id="speed" type="range" min="0.35" max="2.5" step="0.05" value="1"></label><label><input id="paths" type="checkbox" checked> show path graph</label></div>
    <div id="status" class="status">Loading CC0 placeholder models…</div>
  </div>
  <div class="legend"><div><span class="dot amber"></span>friendly / Commander</div><div><span class="dot rose"></span>enemy</div><div><span class="dot teal"></span>junction/path information</div></div>
  <div class="hint">Tap a lane to rotate the Commander</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm';
import * as SkeletonUtils from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/utils/SkeletonUtils.js/+esm';
const app=document.getElementById('app');const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;app.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0e16);const camera=new THREE.OrthographicCamera(-14,14,7.5,-7.5,.1,100);let oblique=true;
function setCamera(){const aspect=innerWidth/innerHeight,halfH=7.5;camera.left=-halfH*aspect;camera.right=halfH*aspect;camera.top=halfH;camera.bottom=-halfH;if(oblique){camera.position.set(0,18,10.5);camera.lookAt(0,0,0)}else{camera.position.set(0,25,.01);camera.lookAt(0,0,0)}camera.updateProjectionMatrix()}setCamera();
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x2b2119,2.2));const sun=new THREE.DirectionalLight(0xffedc7,2.4);sun.position.set(-7,14,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(28,14),new THREE.MeshStandardMaterial({color:0x6c735f,roughness:1,metalness:0}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.02;scene.add(ground);
const court=new THREE.Mesh(new THREE.PlaneGeometry(25,11.6),new THREE.MeshStandardMaterial({color:0x9d9784,roughness:1}));court.rotation.x=-Math.PI/2;court.position.y=0;court.receiveShadow=true;scene.add(court);
function ruinColumn(x,z,h=.9){const mat=new THREE.MeshStandardMaterial({color:0x777467,roughness:.95});const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.22,.27,h,10),mat);shaft.position.set(x,h/2,z);shaft.castShadow=true;shaft.receiveShadow=true;scene.add(shaft);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.14,10),mat);cap.position.set(x,h+.04,z);cap.castShadow=true;scene.add(cap)}
function rubble(x,z,s=.45){const mat=new THREE.MeshStandardMaterial({color:0x69685f,roughness:1});for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(s*(.7+Math.random()*.5),.18+Math.random()*.22,s*(.5+Math.random()*.6)),mat);b.position.set(x+(i-1)*.28,.12,z+(i%2?.18:-.14));b.rotation.y=i*.63;b.castShadow=true;b.receiveShadow=true;scene.add(b)}}
[[-8,6],[-3,6],[2,6],[7,6],[-8,-6],[-2,-6],[3,-6],[8,-6]].forEach((p,i)=>ruinColumn(p[0],p[1],.65+(i%3)*.28));[[-6,5.6],[0,5.7],[5.5,5.8],[-5.5,-5.7],[.5,-5.8],[6,-5.6]].forEach(p=>rubble(p[0],p[1]));
const LANES=[-4,0,4],JUNCTIONS=[-3.5,4.2],laneGroup=new THREE.Group();scene.add(laneGroup);
function ribbon(x,z,w,d,color,opacity=.24){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.035,z);laneGroup.add(m);return m}for(const z of LANES)ribbon(0,z,22.2,1.45,0xe9d9bb,.23);for(const x of JUNCTIONS)ribbon(x,0,1.05,9.1,0x46c8b0,.17);
const pathMat=new THREE.LineBasicMaterial({color:0x46c8b0,transparent:true,opacity:.75}),pathLines=[];function line(points){const geo=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.10,p[1])));const l=new THREE.Line(geo,pathMat);scene.add(l);pathLines.push(l)}for(const z of LANES)line([[-11,z],[11,z]]);for(const x of JUNCTIONS)line([[x,-4],[x,4]]);
function pad(x,z,color=0x8494a6){const p=new THREE.Mesh(new THREE.CylinderGeometry(.62,.72,.14,20),new THREE.MeshStandardMaterial({color,roughness:.8}));p.position.set(x,.09,z);p.castShadow=p.receiveShadow=true;scene.add(p);return p}for(const z of LANES){pad(-5.8,z);pad(1.2,z)}
function tower(x,z,team='friendly'){const c=team==='friendly'?0xf2a93b:0xf2506b,g=new THREE.Group(),base=new THREE.Mesh(new THREE.CylinderGeometry(.48,.6,.55,8),new THREE.MeshStandardMaterial({color:0x343d4b,roughness:.8})),head=new THREE.Mesh(new THREE.BoxGeometry(.75,.35,.45),new THREE.MeshStandardMaterial({color:c,roughness:.65}));head.position.y=.45;const barrel=new THREE.Mesh(new THREE.BoxGeometry(.7,.12,.12),new THREE.MeshStandardMaterial({color:0xd7dde5,metalness:.5,roughness:.4}));barrel.position.set(.55,.5,0);g.add(base,head,barrel);g.position.set(x,.28,z);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g);return g}tower(-5.8,-4);tower(-5.8,0);tower(-5.8,4);tower(6.4,-4,'enemy');tower(6.4,0,'enemy');tower(6.4,4,'enemy');
function bastion(x,z,teamColor){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0x4e5562,roughness:.9}),b=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.15,1.6),mat);b.position.y=.58;const cap=new THREE.Mesh(new THREE.ConeGeometry(.82,.75,4),new THREE.MeshStandardMaterial({color:teamColor,roughness:.75}));cap.rotation.y=Math.PI/4;cap.position.y=1.45;g.add(b,cap);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(g)}LANES.forEach(z=>bastion(-10.4,z,0xf2a93b));LANES.forEach(z=>bastion(9.1,z,0xf2506b));
const gate=new THREE.Group();for(const z of [-2.3,2.3]){const p=new THREE.Mesh(new THREE.BoxGeometry(1.4,3.4,1.4),new THREE.MeshStandardMaterial({color:0x3d3330,roughness:.95}));p.position.set(11.5,1.7,z);p.castShadow=true;gate.add(p)}const arch=new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,5.8),new THREE.MeshStandardMaterial({color:0x4a302b,roughness:.9}));arch.position.set(11.5,3.2,0);gate.add(arch);scene.add(gate);
const assetURLs={knight:'https://raw.githubusercontent.com/ilrein/warptracker/main/public/models/knight.glb',skeleton:'https://raw.githubusercontent.com/ilrein/warptracker/main/public/models/skeleton.glb',bat:'https://raw.githubusercontent.com/ilrein/warptracker/main/public/models/bat.glb'},loader=new GLTFLoader(),templates={},status=document.getElementById('status');
function fallback(type){const g=new THREE.Group(),mainColor=type==='knight'?0xf2a93b:type==='skeleton'?0xded8c7:0xf2506b,body=new THREE.Mesh(new THREE.CapsuleGeometry(.26,.55,4,8),new THREE.MeshStandardMaterial({color:mainColor,roughness:.8}));body.position.y=.6;g.add(body);if(type==='knight'){const shield=new THREE.Mesh(new THREE.BoxGeometry(.12,.65,.52),new THREE.MeshStandardMaterial({color:0x5b6b7b}));shield.position.set(-.35,.75,0);g.add(shield)}else if(type==='bat'){const wingMat=new THREE.MeshStandardMaterial({color:0x6b3244,side:THREE.DoubleSide});for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.ConeGeometry(.5,.9,3),wingMat);w.rotation.z=s*Math.PI/2;w.position.set(s*.5,.75,0);g.add(w)}}g.userData.fallback=true;return{scene:g,animations:[]}}
async function loadAsset(key){return new Promise(resolve=>{loader.load(assetURLs[key],gltf=>{templates[key]=gltf;resolve(gltf)},undefined,err=>{console.warn('asset fallback',key,err);const f=fallback(key);templates[key]=f;resolve(f)})})}await Promise.all(['knight','skeleton','bat'].map(loadAsset));status.textContent=['knight','skeleton','bat'].map(k=>{const g=templates[k],clips=g.animations||[];return `${k}: ${g.scene.userData.fallback?'fallback':'CC0 model'} · ${clips.length} anim`}).join('  |  ');
const mixers=[],movers=[];function tintModel(root,color,amount=.26){root.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];o.material=mats.map(m=>{const c=m.clone();if(c.color)c.color.lerp(new THREE.Color(color),amount);return c})}})}function fitModel(root,targetHeight=1.3){const box=new THREE.Box3().setFromObject(root),size=new THREE.Vector3();box.getSize(size);const scale=targetHeight/Math.max(size.y,.001);root.scale.multiplyScalar(scale);const box2=new THREE.Box3().setFromObject(root);root.position.y-=box2.min.y}function chooseClip(clips,kind='move'){const patterns=kind==='move'?[/run/i,/walk/i,/move/i,/jog/i]:[/idle/i];for(const p of patterns){const c=clips.find(x=>p.test(x.name));if(c)return c}return clips[0]}function spawnModel(type,color,height=1.3){const t=templates[type]||fallback(type),root=SkeletonUtils.clone(t.scene);fitModel(root,height);tintModel(root,color,.32);scene.add(root);let mixer=null;if((t.animations||[]).length){mixer=new THREE.AnimationMixer(root);const clip=chooseClip(t.animations,'move');if(clip)mixer.clipAction(clip).play();mixers.push(mixer)}return{root,mixer}}
function orientTo(root,a,b){const dx=b.x-a.x,dz=b.z-a.z;root.rotation.y=Math.atan2(dx,dz)}class PathMover{constructor(model,points,speed=1.6,loop=false,onDone=null,bob=0){this.root=model.root;this.points=points.map(p=>new THREE.Vector3(p[0],0,p[1]));this.speed=speed;this.loop=loop;this.i=0;this.done=false;this.onDone=onDone;this.bob=bob;this.root.position.copy(this.points[0]);this.baseY=this.root.position.y;if(this.points[1])orientTo(this.root,this.points[0],this.points[1]);movers.push(this)}update(dt){if(this.done)return;let remain=this.speed*dt;while(remain>0&&!this.done){const a=this.root.position,b=this.points[this.i+1];if(!b){if(this.loop){this.i=0;this.root.position.copy(this.points[0]);continue}this.done=true;this.onDone?.();break}const d=a.distanceTo(b);if(d<=remain+.0001){this.root.position.copy(b);remain-=d;this.i++;const n=this.points[this.i+1];if(n)orientTo(this.root,b,n)}else{a.lerp(b,remain/d);remain=0}}if(this.bob)this.root.position.y=this.baseY+Math.sin(performance.now()*.008)*this.bob}}
let commanderModel=spawnModel('knight',0xf2a93b,1.55);commanderModel.root.position.set(-2,0,0);let commanderMover=null,commanderLane=1,commanderX=-2;function commandLane(idx){idx=Math.max(0,Math.min(2,idx));const targetZ=LANES[idx];document.querySelectorAll('[data-lane]').forEach(b=>b.classList.toggle('active',+b.dataset.lane===idx));const pos=commanderModel.root.position;commanderX=pos.x;if(idx===commanderLane)return;const j=JUNCTIONS.reduce((best,x)=>Math.abs(x-pos.x)<Math.abs(best-pos.x)?x:best,JUNCTIONS[0]),pts=[[pos.x,LANES[commanderLane]],[j,LANES[commanderLane]],[j,targetZ],[Math.min(7,j+2.4),targetZ]];if(commanderMover)commanderMover.done=true;commanderMover=new PathMover(commanderModel,pts,2.15,false,()=>{commanderLane=idx;commanderX=commanderModel.root.position.x});commanderLane=idx}document.querySelectorAll('[data-lane]').forEach(b=>b.addEventListener('click',()=>commandLane(+b.dataset.lane)));
function spawnFriendlyWave(){LANES.forEach((z,li)=>{for(let i=0;i<3;i++){const m=spawnModel('skeleton',0xf2a93b,.95),delay=i*.65+li*.18;m.root.visible=false;setTimeout(()=>{m.root.visible=true;new PathMover(m,[[-9.5-i*.35,z],[8.9,z]],1.25+li*.05,false,()=>scene.remove(m.root))},delay*1000)}})}function spawnEnemyWave(){LANES.forEach((z,li)=>{for(let i=0;i<2;i++){const m=spawnModel('bat',0xf2506b,.72),delay=i*.8+li*.16;m.root.visible=false;setTimeout(()=>{m.root.visible=true;m.root.position.y=1.15;const pm=new PathMover(m,[[8.7+i*.3,z],[-9.8,z]],1.55,false,()=>scene.remove(m.root),.08);pm.baseY=1.15},delay*1000)}})}document.getElementById('wave').addEventListener('click',spawnFriendlyWave);document.getElementById('enemy').addEventListener('click',spawnEnemyWave);document.getElementById('camera').addEventListener('click',e=>{oblique=!oblique;setCamera();e.currentTarget.textContent=`Camera: ${oblique?'oblique':'overhead'}`});document.getElementById('paths').addEventListener('change',e=>{laneGroup.visible=e.target.checked;pathLines.forEach(l=>l.visible=e.target.checked)});let simSpeed=1;document.getElementById('speed').addEventListener('input',e=>simSpeed=+e.target.value);
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<350&&e.clientY<210)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(ground);if(hits.length){const z=hits[0].point.z;let idx=0,dist=Infinity;LANES.forEach((lz,i)=>{const d=Math.abs(lz-z);if(d<dist){dist=d;idx=i}});commandLane(idx)}});spawnFriendlyWave();setTimeout(spawnEnemyWave,900);const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05)*simSpeed;mixers.forEach(m=>m.update(dt));movers.forEach(m=>m.update(dt));renderer.render(scene,camera)}animate();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);setCamera()});
</script>
</body>
</html>
