name: IPS v1.14.8 retire legacy peg overlay

on:
  pull_request:
    branches:
      - master
    paths:
      - 'idle-pachinko-shootout/art-v18.js'
      - 'idle-pachinko-shootout/index.html'
      - 'idle-pachinko-shootout/tools/smoke-v1148-single-peg-renderer.mjs'
      - '.github/workflows/ips-v1148-overlay-build.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ips-v1148-retire-legacy-peg-overlay
      - name: Retire obsolete art peg renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          game=Path('idle-pachinko-shootout')
          art=game/'art-v18.js'
          text=art.read_text()
          start=text.index('function setupPegOverlay(){')
          end=text.index('\nfunction boot(){', start)
          text=text[:start]+"// Peg hardware is rendered exclusively by runtime-v130.js.\n"+text[end+1:]
          text=text.replace('setupPegOverlay();','')
          assert 'setupPegOverlay' not in text, 'legacy overlay renderer survived removal'
          art.write_text(text)

          index=game/'index.html'
          text=index.read_text()
          old='art-v18.js?v=1'
          new='art-v18.js?v=20260818-1148'
          assert text.count(old)==1, 'art cache-key target missing or ambiguous'
          index.write_text(text.replace(old,new))
          PY
      - name: Verify single renderer
        run: |
          node --check idle-pachinko-shootout/art-v18.js
          node idle-pachinko-shootout/tools/smoke-v1148-single-peg-renderer.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add idle-pachinko-shootout/art-v18.js idle-pachinko-shootout/index.html
          git commit -m 'Retire legacy eight-row peg art overlay'
          git push origin HEAD:agent/ips-v1148-retire-legacy-peg-overlay
