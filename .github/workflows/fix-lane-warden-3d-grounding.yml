name: Fix Lane Warden 3D grounding

on:
  push:
    paths:
      - '.github/workflows/fix-lane-warden-3d-grounding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch model grounding and visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lane-warden-3d/index.html')
          s = p.read_text()

          old = '''function spawnModel(type,color,height=1.3){
            const t=templates[type]||fallback(type);
            const root=SkeletonUtils.clone(t.scene);
            fitModel(root,height);
            tintModel(root,color,.32);
            scene.add(root);
            let mixer=null;
            if((t.animations||[]).length){
              mixer=new THREE.AnimationMixer(root);
              const clip=chooseClip(t.animations,'move');
              if(clip) mixer.clipAction(clip).play();
              mixers.push(mixer);
            }
            return {root,mixer};
          }'''
          new = '''function spawnModel(type,color,height=1.3,marker=true){
            const t=templates[type]||fallback(type);
            const visual=SkeletonUtils.clone(t.scene);
            fitModel(visual,height);
            tintModel(visual,color,.32);
            const root=new THREE.Group();
            root.add(visual);
            if(marker){
              const ring=new THREE.Mesh(
                new THREE.RingGeometry(.34,.48,28),
                new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85,side:THREE.DoubleSide,depthWrite:false})
              );
              ring.rotation.x=-Math.PI/2;
              ring.position.y=.035;
              root.add(ring);
            }
            scene.add(root);
            let mixer=null;
            if((t.animations||[]).length){
              mixer=new THREE.AnimationMixer(visual);
              const clip=chooseClip(t.animations,'move');
              if(clip) mixer.clipAction(clip).play();
              mixers.push(mixer);
            }
            return {root,visual,mixer};
          }'''
          if old not in s:
              raise SystemExit('spawnModel source block not found')
          s = s.replace(old, new)

          old = '''class PathMover{
            constructor(model,points,speed=1.6,loop=false,onDone=null,bob=0){
              this.root=model.root; this.points=points.map(p=>new THREE.Vector3(p[0],0,p[1]));
              this.speed=speed; this.loop=loop; this.i=0; this.done=false; this.onDone=onDone; this.bob=bob;
              this.root.position.copy(this.points[0]); this.baseY=this.root.position.y;'''
          new = '''class PathMover{
            constructor(model,points,speed=1.6,loop=false,onDone=null,bob=0,elevation=0){
              this.root=model.root; this.points=points.map(p=>new THREE.Vector3(p[0],elevation,p[1]));
              this.speed=speed; this.loop=loop; this.i=0; this.done=false; this.onDone=onDone; this.bob=bob;
              this.root.position.copy(this.points[0]); this.baseY=elevation;'''
          if old not in s:
              raise SystemExit('PathMover source block not found')
          s = s.replace(old, new)

          s = s.replace("let commanderModel=spawnModel('knight',0xf2a93b,1.55);", "let commanderModel=spawnModel('knight',0xf2a93b,1.85,true);")
          s = s.replace("const m=spawnModel('skeleton',0xf2a93b,.95);", "const m=spawnModel('skeleton',0xf2a93b,1.18,true);")
          s = s.replace("const m=spawnModel('bat',0xf2506b,.72);", "const m=spawnModel('bat',0xf2506b,.92,false);")

          old = '''        m.root.visible=true;
                  m.root.position.y=1.15;
                  const pm=new PathMover(m,[[8.7+i*.3,z],[-9.8,z]],1.55,false,()=>scene.remove(m.root),.08);
                  pm.baseY=1.15;'''
          new = '''        m.root.visible=true;
                  new PathMover(m,[[8.7+i*.3,z],[-9.8,z]],1.55,false,()=>scene.remove(m.root),.08,1.15);'''
          if old not in s:
              raise SystemExit('enemy elevation source block not found')
          s = s.replace(old, new)

          s = s.replace('Tap a lane to rotate the Commander</div>', 'Tap a lane to rotate the Commander · build 3D-02</div>')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lane-warden-3d/index.html
          git commit -m "Fix Lane Warden 3D model grounding"
          git push origin master
