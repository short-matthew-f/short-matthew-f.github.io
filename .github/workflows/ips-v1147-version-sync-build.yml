name: IPS v1.14.7 settings version sync build

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/ips-v1147-version-sync-build.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ips-v1147-settings-version-sync
      - name: Patch cache key and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          game = Path('idle-pachinko-shootout')

          settings = game / 'settings-v130.js'
          text = settings.read_text()
          assert "var VERSION='1.14.7';" in text, 'settings VERSION is not v1.14.7'

          index = game / 'index.html'
          text = index.read_text()
          old = 'settings-v130.js?v=20260818-1144'
          new = 'settings-v130.js?v=20260818-1147'
          assert text.count(old) == 1, 'settings cache key target missing or ambiguous'
          index.write_text(text.replace(old, new))

          smoke = game / 'tools/smoke-v1147-core-coherency.mjs'
          text = smoke.read_text()
          old = "const guard=read('core-coherency-v1147.js');\n"
          if "const settings=read('settings-v130.js');" not in text:
              assert text.count(old) == 1, 'smoke settings read anchor missing or ambiguous'
              text = text.replace(old, old + "const settings=read('settings-v130.js');\n")
          old = "assert(/<small> v1\\.14\\.7<\\/small>/.test(html),'visible shell version is not v1.14.7');\n"
          if 'settingsVersion=(settings.match' not in text:
              new = old + "const shellVersion=(html.match(/<title>Idle Pachinko Shootout — v([^<]+)<\\/title>/)||[])[1];\nconst settingsVersion=(settings.match(/var VERSION='([^']+)'/)||[])[1];\nassert(shellVersion&&settingsVersion&&settingsVersion===shellVersion,`settings VERSION ${settingsVersion||'missing'} does not match shell ${shellVersion||'missing'}`);\nassert(html.includes(`settings-v130.js?v=${BUILD}`),'settings script does not use v1.14.7 cache key');\nassert(!html.includes('settings-v130.js?v=20260818-1144'),'stale settings cache key is still active');\n"
              assert text.count(old) == 1, 'smoke version assertion anchor missing or ambiguous'
              text = text.replace(old, new)
          smoke.write_text(text)
          PY
      - name: Verify fix
        run: |
          node --check idle-pachinko-shootout/settings-v130.js
          node idle-pachinko-shootout/tools/smoke-v1147-core-coherency.mjs
          git diff --check
      - name: Commit non-workflow files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add idle-pachinko-shootout/index.html idle-pachinko-shootout/tools/smoke-v1147-core-coherency.mjs
          git commit -m 'Sync v1.14.7 settings version and cache key'
          git push origin HEAD:agent/ips-v1147-settings-version-sync
