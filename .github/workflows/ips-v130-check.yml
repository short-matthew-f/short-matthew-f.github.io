name: IPS v1.14.6 runtime check

on:
  push:
    branches:
      - agent/ips-v1144-crossbar-stability
      - agent/ips-v1146-six-row-board
    paths:
      - 'idle-pachinko-shootout/index.html'
      - 'idle-pachinko-shootout/engine-v130.js'
      - 'idle-pachinko-shootout/runtime-v130.js'
      - 'idle-pachinko-shootout/settings-v130.js'
      - 'idle-pachinko-shootout/campaign-v131.js'
      - 'idle-pachinko-shootout/onboarding-v131.js'
      - 'idle-pachinko-shootout/onboarding-v131.css'
      - 'idle-pachinko-shootout/progression-v132.js'
      - 'idle-pachinko-shootout/feel-v133.js'
      - 'idle-pachinko-shootout/feel-v133.css'
      - 'idle-pachinko-shootout/dustwater-v1140.js'
      - 'idle-pachinko-shootout/dustwater-v1140.css'
      - 'idle-pachinko-shootout/dustwater-audio-v1140.js'
      - 'idle-pachinko-shootout/mobile-sheet-v1141.css'
      - 'idle-pachinko-shootout/board-machine-v1142.js'
      - 'idle-pachinko-shootout/board-machine-v1142.css'
      - 'idle-pachinko-shootout/launcher-stability-v1144.css'
      - 'idle-pachinko-shootout/board-geometry-v1146.css'
      - 'idle-pachinko-shootout/tools/apply-v1146-board-geometry.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v130.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v131-onboarding.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v132-progression.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v133-feel.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1140-identity.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1141-mobile-sheet.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1142-board-machine.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1143-pin-flicker.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1144-crossbar-stability.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1146-board-geometry.mjs'
      - '.github/workflows/ips-v130-check.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'idle-pachinko-shootout/index.html'
      - 'idle-pachinko-shootout/engine-v130.js'
      - 'idle-pachinko-shootout/runtime-v130.js'
      - 'idle-pachinko-shootout/settings-v130.js'
      - 'idle-pachinko-shootout/campaign-v131.js'
      - 'idle-pachinko-shootout/onboarding-v131.js'
      - 'idle-pachinko-shootout/onboarding-v131.css'
      - 'idle-pachinko-shootout/progression-v132.js'
      - 'idle-pachinko-shootout/feel-v133.js'
      - 'idle-pachinko-shootout/feel-v133.css'
      - 'idle-pachinko-shootout/dustwater-v1140.js'
      - 'idle-pachinko-shootout/dustwater-v1140.css'
      - 'idle-pachinko-shootout/dustwater-audio-v1140.js'
      - 'idle-pachinko-shootout/mobile-sheet-v1141.css'
      - 'idle-pachinko-shootout/board-machine-v1142.js'
      - 'idle-pachinko-shootout/board-machine-v1142.css'
      - 'idle-pachinko-shootout/launcher-stability-v1144.css'
      - 'idle-pachinko-shootout/board-geometry-v1146.css'
      - 'idle-pachinko-shootout/tools/apply-v1146-board-geometry.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v130.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v131-onboarding.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v132-progression.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v133-feel.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1140-identity.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1141-mobile-sheet.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1142-board-machine.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1143-pin-flicker.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1144-crossbar-stability.mjs'
      - 'idle-pachinko-shootout/tools/smoke-v1146-board-geometry.mjs'
      - '.github/workflows/ips-v130-check.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Generate v1.14.6 six-row board
        run: node idle-pachinko-shootout/tools/apply-v1146-board-geometry.mjs
      - name: JavaScript syntax
        run: |
          node --check idle-pachinko-shootout/engine-v130.js
          node --check idle-pachinko-shootout/runtime-v130.js
          node --check idle-pachinko-shootout/settings-v130.js
          node --check idle-pachinko-shootout/campaign-v131.js
          node --check idle-pachinko-shootout/onboarding-v131.js
          node --check idle-pachinko-shootout/progression-v132.js
          node --check idle-pachinko-shootout/feel-v133.js
          node --check idle-pachinko-shootout/dustwater-v1140.js
          node --check idle-pachinko-shootout/dustwater-audio-v1140.js
          node --check idle-pachinko-shootout/board-machine-v1142.js
          node --check idle-pachinko-shootout/tools/flatten-engine.mjs
          node --check idle-pachinko-shootout/tools/apply-v1146-board-geometry.mjs
          node --check idle-pachinko-shootout/tools/smoke-v130.mjs
          node --check idle-pachinko-shootout/tools/smoke-v131-onboarding.mjs
          node --check idle-pachinko-shootout/tools/smoke-v132-progression.mjs
          node --check idle-pachinko-shootout/tools/smoke-v133-feel.mjs
          node --check idle-pachinko-shootout/tools/smoke-v1140-identity.mjs
          node --check idle-pachinko-shootout/tools/smoke-v1141-mobile-sheet.mjs
          node --check idle-pachinko-shootout/tools/smoke-v1142-board-machine.mjs
          node --check idle-pachinko-shootout/tools/smoke-v1143-pin-flicker.mjs
          node --check idle-pachinko-shootout/tools/smoke-v1144-crossbar-stability.mjs
          node --check idle-pachinko-shootout/tools/smoke-v1146-board-geometry.mjs
      - name: Static engine architecture
        run: |
          ! grep -Eq "fetch\(['\"]engine-v|new Function\(" idle-pachinko-shootout/engine-v130.js
          grep -q 'engine-v130.js' idle-pachinko-shootout/index.html
          grep -q 'runtime-v130.js' idle-pachinko-shootout/index.html
          grep -q 'settings-v130.js' idle-pachinko-shootout/index.html
          grep -q 'campaign-v131.js' idle-pachinko-shootout/index.html
          grep -q 'onboarding-v131.js' idle-pachinko-shootout/index.html
          grep -q 'onboarding-v131.css' idle-pachinko-shootout/index.html
          grep -q 'progression-v132.js' idle-pachinko-shootout/index.html
          grep -q 'feel-v133.js' idle-pachinko-shootout/index.html
          grep -q 'feel-v133.css' idle-pachinko-shootout/index.html
          grep -q 'dustwater-v1140.js' idle-pachinko-shootout/index.html
          grep -q 'dustwater-v1140.css' idle-pachinko-shootout/index.html
          grep -q 'dustwater-audio-v1140.js' idle-pachinko-shootout/index.html
          grep -q 'mobile-sheet-v1141.css' idle-pachinko-shootout/index.html
          grep -q 'board-machine-v1142.js' idle-pachinko-shootout/index.html
          grep -q 'board-machine-v1142.css' idle-pachinko-shootout/index.html
          grep -q 'launcher-stability-v1144.css' idle-pachinko-shootout/index.html
          grep -q 'board-geometry-v1146.css' idle-pachinko-shootout/index.html
      - name: Legacy runtime layers are inactive
        run: |
          ! grep -Eq 'progression-v117.js|ui-v111.js|peg-v113.js|peg-v115.js|peg-v117.js|board-v121.js|engine-v121-loader.js|campaign-v10.js' idle-pachinko-shootout/index.html
      - name: No upgrade-sheet subtree observer
        run: |
          ! grep -Eq "observe\([^\n]*sheetContent|observe\(content,\{childList:true,subtree:true\}" idle-pachinko-shootout/runtime-v130.js
          ! grep -Eq "observe\([^\n]*sheetContent|observe\(content,\{childList:true,subtree:true\}" idle-pachinko-shootout/campaign-v131.js
          ! grep -Eq "observe\([^\n]*sheetContent|observe\(content,\{childList:true,subtree:true\}" idle-pachinko-shootout/onboarding-v131.js
          ! grep -Eq "observe\([^\n]*sheetContent|observe\(content,\{childList:true,subtree:true\}" idle-pachinko-shootout/progression-v132.js
          ! grep -Eq "observe\([^\n]*sheetContent|observe\(content,\{childList:true,subtree:true\}" idle-pachinko-shootout/feel-v133.js
          ! grep -Eq "observe\([^\n]*sheetContent|observe\(content,\{childList:true,subtree:true\}" idle-pachinko-shootout/dustwater-v1140.js
          ! grep -Eq "observe\([^\n]*sheetContent|observe\(content,\{childList:true,subtree:true\}" idle-pachinko-shootout/dustwater-audio-v1140.js
          ! grep -Eq "MutationObserver|observe\(" idle-pachinko-shootout/board-machine-v1142.js
      - name: Install smoke-test DOM
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Board / peg persistence smoke test
        run: node idle-pachinko-shootout/tools/smoke-v130.mjs
      - name: Guided onboarding / lifecycle smoke test
        run: node idle-pachinko-shootout/tools/smoke-v131-onboarding.mjs
      - name: First-session progression / economy smoke test
        run: node idle-pachinko-shootout/tools/smoke-v132-progression.mjs
      - name: Core game feel smoke test
        run: node idle-pachinko-shootout/tools/smoke-v133-feel.mjs
      - name: Dustwater identity smoke test
        run: node idle-pachinko-shootout/tools/smoke-v1140-identity.mjs
      - name: Mobile sheet viewport smoke test
        run: node idle-pachinko-shootout/tools/smoke-v1141-mobile-sheet.mjs
      - name: Board machine legibility smoke test
        run: node idle-pachinko-shootout/tools/smoke-v1142-board-machine.mjs
      - name: Firing Pin flicker smoke test
        run: node idle-pachinko-shootout/tools/smoke-v1143-pin-flicker.mjs
      - name: Cylinder crossbar stability smoke test
        run: node idle-pachinko-shootout/tools/smoke-v1144-crossbar-stability.mjs
      - name: Six-row board geometry / save migration smoke test
        run: node idle-pachinko-shootout/tools/smoke-v1146-board-geometry.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Commit generated v1.14.6 files back to branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idle-pachinko-shootout .github/workflows/ips-v130-check.yml
          git commit -m "Idle Pachinko v1.14.6 six-row board [v1146-generated]"
          git push origin HEAD:${{ github.head_ref }}
