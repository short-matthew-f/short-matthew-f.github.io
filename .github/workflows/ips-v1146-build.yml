name: IPS v1.14.6 remote build

on:
  push:
    branches:
      - agent/ips-v1146-six-row-board

permissions:
  contents: write

jobs:
  build-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v1146-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ips-v1146-six-row-board
          fetch-depth: 0
      - name: Apply deterministic board geometry change
        run: node idle-pachinko-shootout/tools/apply-v1146-board-geometry.mjs
      - name: JavaScript syntax
        run: |
          node --check idle-pachinko-shootout/engine-v130.js
          node --check idle-pachinko-shootout/runtime-v130.js
          node --check idle-pachinko-shootout/tools/flatten-engine.mjs
          node --check idle-pachinko-shootout/tools/smoke-v1146-board-geometry.mjs
      - name: Verify flattened engine is reproducible
        run: |
          cp idle-pachinko-shootout/engine-v130.js /tmp/engine-v1146.js
          node idle-pachinko-shootout/tools/flatten-engine.mjs
          cmp /tmp/engine-v1146.js idle-pachinko-shootout/engine-v130.js
      - name: Install smoke-test DOM
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Full game regression smoke suite
        run: |
          node idle-pachinko-shootout/tools/smoke-v130.mjs
          node idle-pachinko-shootout/tools/smoke-v131-onboarding.mjs
          node idle-pachinko-shootout/tools/smoke-v132-progression.mjs
          node idle-pachinko-shootout/tools/smoke-v133-feel.mjs
          node idle-pachinko-shootout/tools/smoke-v1140-identity.mjs
          node idle-pachinko-shootout/tools/smoke-v1141-mobile-sheet.mjs
          node idle-pachinko-shootout/tools/smoke-v1142-board-machine.mjs
          node idle-pachinko-shootout/tools/smoke-v1143-pin-flicker.mjs
          node idle-pachinko-shootout/tools/smoke-v1144-crossbar-stability.mjs
          node idle-pachinko-shootout/tools/smoke-v1146-board-geometry.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Commit generated v1.14.6 changes
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idle-pachinko-shootout .github/workflows/ips-v130-check.yml
          git commit -m "Idle Pachinko v1.14.6 six-row board [v1146-generated]"
          git push origin HEAD:agent/ips-v1146-six-row-board
