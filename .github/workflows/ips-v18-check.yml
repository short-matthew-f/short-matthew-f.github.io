name: IPS v1.8 validation
on:
  push:
    branches: [idle-pachinko-v1.8-art-flow]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check v1.8 scripts
        run: |
          node --check idle-pachinko-shootout/progression-v18.js
          node --check idle-pachinko-shootout/flow-v18.js
          node --check idle-pachinko-shootout/art-v18.js
      - name: Assert stabilized blueprint flow
        run: |
          grep -q "document.addEventListener('ips:menu'" idle-pachinko-shootout/progression-v18.js
          ! grep -q "observe(content" idle-pachinko-shootout/progression-v18.js
          grep -q "queuedToasts" idle-pachinko-shootout/progression-v18.js
          grep -q "rewardFlowBlocked" idle-pachinko-shootout/progression-v18.js
      - name: Assert v1.8 art wiring
        run: |
          grep -q "art-v18.css" idle-pachinko-shootout/index.html
          grep -q "progression-v18.js" idle-pachinko-shootout/index.html
          grep -q "flow-v18.js" idle-pachinko-shootout/index.html
          grep -q "art-v18.js" idle-pachinko-shootout/index.html
          grep -q "metalPeg" idle-pachinko-shootout/art-v18.js
          grep -q "repaintEnemies" idle-pachinko-shootout/art-v18.js
