name: IPS v1.7 status engine patch
on:
  push:
    branches: [idle-pachinko-v1.7-combat-readability]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'APPLY STATUS PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: idle-pachinko-v1.7-combat-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v1.7 engine and progression files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          src = Path('idle-pachinko-shootout/engine-v13.js').read_text()

          src = replace_once(src,
          "var AMMO={standard:{name:'Standard',short:'STD',tag:'',mult:1,unlock:0,color:'#e1bd73',desc:'Full damage. Reliable baseline round.'},gold:{name:'Golden',short:'GOLD',tag:'gold',mult:.88,unlock:120,color:'#ffd957',desc:'88% damage. Killing blow pays 2× bounty coins.'},fire:{name:'Incendiary',short:'FIRE',tag:'fire',mult:.82,unlock:150,color:'#ff9a3d',desc:'82% damage. Applies three burn ticks; peg effects can stack.'},pierce:{name:'Piercing',short:'PEN',tag:'pierce',mult:.82,unlock:180,color:'#7de3ed',desc:'82% damage. Continues through enemies with 65% retention.'},boom:{name:'Dynamite',short:'BOOM',tag:'boom',mult:.75,unlock:220,color:'#ff7348',desc:'75% damage. Splash hits nearby enemies for 50% / 25%.'},chain:{name:'Storm',short:'ARC',tag:'chain',mult:.72,unlock:280,color:'#c89aff',desc:'72% damage. Lower primary impact, then lightning jumps.'}},AMMO_ORDER=['standard','gold','fire','pierce','boom','chain'];",
          "var AMMO={standard:{name:'Standard',short:'STD',tag:'',mult:1,unlock:0,color:'#e1bd73',desc:'Full damage. Reliable baseline round.'},gold:{name:'Golden',short:'GOLD',tag:'gold',mult:.88,unlock:120,color:'#ffd957',desc:'88% damage. Killing blow pays 2× bounty coins.'},fire:{name:'Incendiary',short:'FIRE',tag:'fire',mult:.82,unlock:150,color:'#ff9a3d',desc:'82% damage. Applies enemy-bound burn ticks; peg effects can stack.'},concuss:{name:'Concussive',short:'STUN',tag:'concuss',mult:.20,unlock:190,color:'#ffe39a',desc:'20% damage. Stops every enemy it actually hits; tuning extends stun time.'},shrapnel:{name:'Shrapnel',short:'SHRP',tag:'shrapnel',mult:.60,unlock:240,color:'#d8c5a5',desc:'60% starting damage. Every peg hit adds 10% to the eventual payload.'},poison:{name:'Poison Cloud',short:'TOX',tag:'poison',mult:.35,unlock:300,color:'#7bd56a',desc:'35% impact. Leaves a lingering cloud that damages enemies moving through it.'},pierce:{name:'Piercing',short:'PEN',tag:'pierce',mult:.82,unlock:180,color:'#7de3ed',desc:'82% damage. Continues through enemies with 65% retention.'},boom:{name:'Dynamite',short:'BOOM',tag:'boom',mult:.75,unlock:220,color:'#ff7348',desc:'75% damage. Splash hits nearby enemies for 50% / 25%.'},chain:{name:'Storm',short:'ARC',tag:'chain',mult:.72,unlock:280,color:'#c89aff',desc:'72% damage. Lower primary impact, then lightning jumps.'}},AMMO_ORDER=['standard','gold','fire','concuss','shrapnel','poison','pierce','boom','chain'];",
          'ammo definitions')

          src = replace_once(src,
          "ammoUnlock:{standard:1,gold:0,fire:0,pierce:0,boom:0,chain:0},ammoRank:{standard:0,gold:0,fire:0,pierce:0,boom:0,chain:0},ammoQty:{standard:999,gold:0,fire:0,pierce:0,boom:0,chain:0}",
          "ammoUnlock:{standard:1,gold:0,fire:0,concuss:0,shrapnel:0,poison:0,pierce:0,boom:0,chain:0},ammoRank:{standard:0,gold:0,fire:0,concuss:0,shrapnel:0,poison:0,pierce:0,boom:0,chain:0},ammoQty:{standard:999,gold:0,fire:0,concuss:0,shrapnel:0,poison:0,pierce:0,boom:0,chain:0}",
          'ammo save defaults')

          src = replace_once(src,
          "nextAttack:0};if(e.bossType==='undertaker')",
          "nextAttack:0,effects:{burns:[]},stunUntil:0};if(e.bossType==='undertaker')",
          'enemy status state')

          src = replace_once(src,
          "nextAttack:0,summoned:true};}",
          "nextAttack:0,summoned:true,effects:{burns:[]},stunUntil:0};}",
          'summon status state')

          src = replace_once(src,
          "emptySince:0};B=[];buildPegs();spawnWave();",
          "emptySince:0,clouds:[]};B=[];buildPegs();spawnWave();",
          'run cloud state')

          src = replace_once(src,
          "function spawnWave(){var n=G.wave%10===0?1:(G.wave<3?1:(G.wave<6?2:3)),i;G.enemies=[];",
          "function spawnWave(){var n=G.wave%10===0?1:(G.wave<3?1:(G.wave<6?2:3)),i;G.enemies=[];G.clouds=[];clearPoisonCloudFx();",
          'wave clears battlefield effects')

          src = replace_once(src,
          "trail:[]};if(!src)tag(b,(AMMO[ammo]||AMMO.standard).tag);",
          "trail:[],pegHits:src?Number(src.pegHits||0):0};if(!src)tag(b,(AMMO[ammo]||AMMO.standard).tag);",
          'ball peg hit state')

          src = replace_once(src,
          "function addBoardFx(x,y,type){FX.push({x:x,y:y,type:type,life:.36,max:.36});}function pegEffect(b,p){var c;if(p.t==='n')",
          "function addBoardFx(x,y,type){FX.push({x:x,y:y,type:type,life:.36,max:.36});}function pegEffect(b,p){var c;b.pegHits=Number(b.pegHits||0)+1;if(p.t==='n')",
          'count every peg collision')

          src = replace_once(src,
          "p:b.p,ammo:b.ammo,trail:[]};b.vx=",
          "p:b.p,ammo:b.ammo,trail:[],pegHits:Number(b.pegHits||0)};b.vx=",
          'splitter inherits shrapnel')

          src = replace_once(src,
          "shoot(d,b.tags,crit,b.ammo);G.resolved++;",
          "shoot(d,b.tags,crit,b.ammo,Number(b.pegHits||0));G.resolved++;",
          'send peg count to payload')

          old_hit = "function hit(e,d,crit,gold,label,tags){if(!e||e.hp<=0)return;tags=tags||[];var before=e.hp,mod=1,note=label||'',absorbed,remaining;"
          new_hit = "function hit(e,d,crit,gold,label,tags){if(!e||e.hp<=0)return;tags=tags||[];var before=e.hp,mod=1,note=label||'',absorbed,remaining,statusDamage;"
          src = replace_once(src, old_hit, new_hit, 'hit status damage variable')

          src = replace_once(src,
          "e.hp-=d;pop(Math.round(d),crit,note);emit('enemyHit'",
          "statusDamage=d;e.hp-=d;if(e.hp>0&&has(tags,'fire')&&!has(tags,'status'))applyBurn(e,statusDamage);if(e.hp>0&&has(tags,'concuss')&&!has(tags,'status'))applyConcussion(e);pop(Math.round(d),crit,note);emit('enemyHit'",
          'apply enemy-bound statuses')

          old_targets = "function combatTargets(){var a=living(),out=[],i,focus=null;if(!G)return a;if(G.focusId){for(i=0;i<a.length;i++)if(a[i].id===G.focusId){focus=a[i];break;}}if(!focus){G.focusId=null;return a;}out.push(focus);for(i=0;i<a.length;i++)if(a[i].id!==focus.id)out.push(a[i]);return out;}function shoot(raw,tags,crit,ammo){var a=combatTargets(),i,x,primary=raw,kind='normal',burnBase=raw;if(!a.length)return;if(has(tags,'chain')){primary*=.78;kind='chain';}if(has(tags,'fire')){primary*=.72;kind='fire';}if(has(tags,'boom'))kind='boom';if(has(tags,'pierce'))kind='pierce';lineFx(a[0].id,kind,crit);emit('shot',{kind:kind,crit:crit,ammo:ammo});hit(a[0],primary,crit,has(tags,'gold'),'',tags);if(has(tags,'pierce')){x=raw*.65;for(i=1;i<Math.min(4,a.length);i++){hit(a[i],x,false,false,'PIERCE',tags);x*=.65;}}if(has(tags,'boom'))for(i=1;i<Math.min(3,a.length);i++)hit(a[i],raw*(i===1?.5:.25),false,false,'BOOM',tags);if(has(tags,'chain')){x=raw*.55;for(i=1;i<Math.min(4,a.length);i++){hit(a[i],x,false,false,'CHAIN',tags);x*=.62;}}if(has(tags,'fire'))for(i=1;i<=3;i++)setTimeout(function(){var live=combatTargets();if(live.length)hit(live[0],burnBase*.13,false,false,'BURN',['fire']);},i*650);if(has(tags,'fire')&&has(tags,'boom'))pop('INCENDIARY BLAST',false,'COMBO');if(has(tags,'pierce')&&has(tags,'chain'))pop('RAIL ARC',false,'COMBO');}"
          new_targets = "function combatTargets(){var a=living(),out=[],i,focus=null;if(!G)return a;if(G.focusId){for(i=0;i<a.length;i++)if(a[i].id===G.focusId){focus=a[i];break;}}if(!focus){G.focusId=null;return a;}out.push(focus);for(i=0;i<a.length;i++)if(a[i].id!==focus.id)out.push(a[i]);return out;}function ensureEffects(e){if(!e.effects)e.effects={burns:[]};if(!e.effects.burns)e.effects.burns=[];return e.effects;}function applyBurn(e,damage){var fx=ensureEffects(e),now=performance.now();fx.burns.push({ticks:3,next:now+650,damage:damage*.13});e.burned=true;}function concussionDuration(){return Math.min(3.4,1.4+Number(save.ammoRank.concuss||0)*.25);}function applyConcussion(e){var until=performance.now()+concussionDuration()*1000;e.stunUntil=Math.max(Number(e.stunUntil||0),until);pop('STUNNED '+concussionDuration().toFixed(1)+'s',false,'CONCUSS');}function clearPoisonCloudFx(){var nodes=document.querySelectorAll('.poison-cloud-fx'),i;for(i=0;i<nodes.length;i++)nodes[i].remove();}function poisonCloudVisual(c,e){var combat=$('combat'),target=enemyElement(e.id),layer=$('combatFx');if(!combat||!target||!layer)return;var cr=combat.getBoundingClientRect(),tr=target.getBoundingClientRect(),v=document.createElement('i');v.className='poison-cloud-fx';v.setAttribute('data-cloud-id',c.id);v.style.left=(tr.left-cr.left+tr.width*.5-38)+'px';v.style.top=(tr.top-cr.top+tr.height*.45-24)+'px';layer.appendChild(v);}function createPoisonCloud(e,base){if(!G||!e)return;var rank=Number(save.ammoRank.poison||0),now=performance.now(),c={id:id(),lane:e.lane,center:Number(e.advance||0),radius:.58,laneRadius:1,damage:base*.16,next:now+420,expires:now+(5000+Math.min(3000,rank*500))};G.clouds.push(c);poisonCloudVisual(c,e);pop('POISON CLOUD',false,'HAZARD');}function updateStatusEffects(now){if(!G)return;var i,j,e,fx,b,c,a,k,nodes;for(i=0;i<G.enemies.length;i++){e=G.enemies[i];if(e.hp<=0)continue;fx=ensureEffects(e);for(j=fx.burns.length-1;j>=0;j--){b=fx.burns[j];while(b.ticks>0&&now>=b.next&&e.hp>0){hit(e,b.damage,false,false,'BURN',['fire','status']);b.ticks--;b.next+=650;}if(b.ticks<=0||e.hp<=0)fx.burns.splice(j,1);}}for(i=G.clouds.length-1;i>=0;i--){c=G.clouds[i];if(now>=c.expires){nodes=document.querySelectorAll('[data-cloud-id=\"'+c.id+'\"]');for(k=0;k<nodes.length;k++)nodes[k].remove();G.clouds.splice(i,1);continue;}if(now<c.next)continue;c.next=now+500;a=living();for(j=0;j<a.length;j++){e=a[j];if(Math.abs(Number(e.lane||0)-c.lane)<=c.laneRadius&&Math.abs(Number(e.advance||0)-c.center)<=c.radius)hit(e,c.damage,false,false,'POISON',['poison','status']);}}}function shoot(raw,tags,crit,ammo,pegHits){var a=combatTargets(),i,x,primary=raw,kind='normal',shrapnelBonus=1;if(!a.length)return;if(has(tags,'shrapnel')){shrapnelBonus=1+.10*Math.max(0,Number(pegHits||0));raw*=shrapnelBonus;primary=raw;kind='shrapnel';if(pegHits)pop('+'+Math.round((shrapnelBonus-1)*100)+'% SHRAPNEL',false,pegHits+' PEGS');}if(has(tags,'concuss'))kind='concuss';if(has(tags,'poison'))kind='poison';if(has(tags,'chain')){primary*=.78;kind='chain';}if(has(tags,'fire')){primary*=.72;kind='fire';}if(has(tags,'boom'))kind='boom';if(has(tags,'pierce'))kind='pierce';lineFx(a[0].id,kind,crit);emit('shot',{kind:kind,crit:crit,ammo:ammo,pegHits:pegHits||0});hit(a[0],primary,crit,has(tags,'gold'),'',tags);if(has(tags,'poison'))createPoisonCloud(a[0],raw);if(has(tags,'pierce')){x=raw*.65;for(i=1;i<Math.min(4,a.length);i++){hit(a[i],x,false,false,'PIERCE',tags);x*=.65;}}if(has(tags,'boom'))for(i=1;i<Math.min(3,a.length);i++)hit(a[i],raw*(i===1?.5:.25),false,false,'BOOM',tags);if(has(tags,'chain')){x=raw*.55;for(i=1;i<Math.min(4,a.length);i++){hit(a[i],x,false,false,'CHAIN',tags);x*=.62;}}if(has(tags,'fire')&&has(tags,'boom'))pop('INCENDIARY BLAST',false,'COMBO');if(has(tags,'pierce')&&has(tags,'chain'))pop('RAIL ARC',false,'COMBO');}"
          src = replace_once(src, old_targets, new_targets, 'replace timer-based burn with status system')

          src = replace_once(src,
          "ensureMotion(e,now);r=combatRole(e);ideal=",
          "ensureMotion(e,now);if(e.stunUntil&&now<e.stunUntil)continue;r=combatRole(e);ideal=",
          'stun freezes movement and attacks')

          src = replace_once(src,
          "physics(dt);updateEnemyMotion(dt,now);",
          "physics(dt);updateStatusEffects(now);updateEnemyMotion(dt,now);",
          'tick battlefield statuses')

          src = replace_once(src,
          "function ballColor(b){if(has(b.tags,'chain'))return'#c89aff';if(has(b.tags,'boom'))return'#ff7348';if(has(b.tags,'fire'))return'#ff9a3d';if(has(b.tags,'pierce'))return'#7de3ed';if(has(b.tags,'gold'))return'#ffd957';return ammoColor(b.ammo);}",
          "function ballColor(b){if(has(b.tags,'chain'))return'#c89aff';if(has(b.tags,'boom'))return'#ff7348';if(has(b.tags,'fire'))return'#ff9a3d';if(has(b.tags,'poison'))return'#7bd56a';if(has(b.tags,'concuss'))return'#ffe39a';if(has(b.tags,'shrapnel'))return'#d8c5a5';if(has(b.tags,'pierce'))return'#7de3ed';if(has(b.tags,'gold'))return'#ffd957';return ammoColor(b.ammo);}",
          'new ammo ball colors')

          src = replace_once(src,
          "if(e.frenzy)c+=' enraged';if(e.affix==='armored'||e.bossType==='train')c+=' armored';return c;}",
          "if(e.frenzy)c+=' enraged';if(e.stunUntil&&e.stunUntil>performance.now())c+=' stunned';if(e.effects&&e.effects.burns&&e.effects.burns.length)c+=' burning';if(e.affix==='armored'||e.bossType==='train')c+=' armored';return c;}",
          'enemy status css classes')

          src = replace_once(src,
          "if(e.frenzy)h+='<span class=\"enemy-badge warn\">ENRAGED</span>';return h;}",
          "if(e.frenzy)h+='<span class=\"enemy-badge warn\">ENRAGED</span>';if(e.stunUntil&&e.stunUntil>performance.now())h+='<span class=\"enemy-badge stunned\">STUNNED</span>';if(e.effects&&e.effects.burns&&e.effects.burns.length)h+='<span class=\"enemy-badge burning\">BURNING</span>';return h;}",
          'enemy status badges')

          src = replace_once(src,
          "window.__ipsAPI={snapshot:function(){return clone(save);}",
          "window.__ipsAPI={snapshot:function(){return clone(save);}",
          'api anchor')
          src = src.replace("version:'1.3'", "version:'1.7'", 1)

          Path('idle-pachinko-shootout/engine-v17.js').write_text(src)

          p = Path('idle-pachinko-shootout/progression-v15.js').read_text()
          p = replace_once(p,
          " fire:{clear:5,cost:250,label:'INCENDIARY WORKS',desc:'Fire ammo + Fire Peg',sheets:['board','ammo']},\n gold:{clear:10,cost:650,label:'GILDED CARTRIDGE',desc:'Golden ammunition',sheets:['ammo']},\n split:{clear:15,cost:1100,label:'SPLITTER JIG',desc:'Splitter Peg',sheets:['board']},\n pierce:{clear:22,cost:1900,label:'LONGBORE TOOLING',desc:'Piercing ammo + Piercing Peg',sheets:['board','ammo']},",
          " fire:{clear:5,cost:250,label:'INCENDIARY WORKS',desc:'Fire ammo + Fire Peg',sheets:['board','ammo']},\n gold:{clear:10,cost:650,label:'GILDED CARTRIDGE',desc:'Golden ammunition',sheets:['ammo']},\n concuss:{clear:12,cost:900,label:'CONCUSSION DIES',desc:'Concussive ammunition',sheets:['ammo']},\n split:{clear:15,cost:1100,label:'SPLITTER JIG',desc:'Splitter Peg',sheets:['board']},\n shrapnel:{clear:18,cost:1500,label:'SHRAPNEL LOADER',desc:'Shrapnel ammunition',sheets:['ammo']},\n pierce:{clear:22,cost:1900,label:'LONGBORE TOOLING',desc:'Piercing ammo + Piercing Peg',sheets:['board','ammo']},\n poison:{clear:26,cost:2600,label:'MIASMA CAPSULE',desc:'Poison Cloud ammunition',sheets:['ammo']},",
          'new blueprint definitions')
          p = replace_once(p,
          "var ORDER=['fire','gold','split','pierce','boom','chain'];",
          "var ORDER=['fire','gold','concuss','split','shrapnel','pierce','poison','boom','chain'];",
          'new blueprint order')
          Path('idle-pachinko-shootout/progression-v17.js').write_text(p)

          # The old cross-wave burn timer must not survive in v1.7.
          if "setTimeout(function(){var live=combatTargets();if(live.length)hit(live[0],burnBase*.13" in src:
              raise SystemExit('old transferable burn timer still present')
          for required in ['applyBurn','applyConcussion','createPoisonCloud','updateStatusEffects','pegHits','Concussive','Shrapnel','Poison Cloud']:
              if required not in src:
                  raise SystemExit(f'missing required v1.7 feature: {required}')
      - name: Syntax check generated scripts
        run: |
          node --check idle-pachinko-shootout/engine-v17.js
          node --check idle-pachinko-shootout/progression-v17.js
      - name: Remove one-shot patch machinery
        run: rm -f .github/workflows/ips-v17-patch.yml .ips-v17-trigger
      - name: Commit generated v1.7 engine
        run: |
          git config user.name "Matthew Short"
          git config user.email "short.matthew.f@gmail.com"
          git add -A
          git commit -m "Idle Pachinko v1.7: enemy-bound status effects and specialty rounds"
          git push origin idle-pachinko-v1.7-combat-readability
