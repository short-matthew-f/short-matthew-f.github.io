name: IPS flatten engine

on:
  push:
    branches:
      - idle-pachinko-v1.13-engine-cleanup
    paths:
      - 'idle-pachinko-shootout/tools/flatten-engine.mjs'
      - 'idle-pachinko-shootout/engine-v121-loader.js'
      - 'idle-pachinko-shootout/engine-v117-loader.js'
      - 'idle-pachinko-shootout/engine-v114-loader.js'
      - 'idle-pachinko-shootout/engine-v113-loader.js'
      - 'idle-pachinko-shootout/engine-v111-loader.js'
      - 'idle-pachinko-shootout/engine-v17.js'
      - '.github/workflows/ips-flatten-engine.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'idle-pachinko-shootout/tools/flatten-engine.mjs'
      - 'idle-pachinko-shootout/engine-v121-loader.js'
      - 'idle-pachinko-shootout/engine-v117-loader.js'
      - 'idle-pachinko-shootout/engine-v114-loader.js'
      - 'idle-pachinko-shootout/engine-v113-loader.js'
      - 'idle-pachinko-shootout/engine-v111-loader.js'
      - 'idle-pachinko-shootout/engine-v17.js'
      - '.github/workflows/ips-flatten-engine.yml'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Generate flattened engine
        run: node idle-pachinko-shootout/tools/flatten-engine.mjs
      - name: Syntax check
        run: node --check idle-pachinko-shootout/engine-v130.js
      - name: Diff sanity
        run: git diff --check
      - name: Commit generated engine
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- idle-pachinko-shootout/engine-v130.js; then
            echo 'engine-v130.js already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add idle-pachinko-shootout/engine-v130.js
          git commit -m 'Build flattened v1.13 engine'
          git push
