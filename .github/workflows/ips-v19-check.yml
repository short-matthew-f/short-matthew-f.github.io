name: IPS v1.9 sprite validation
on:
  push:
    branches: [idle-pachinko-v1.9-sprite-runtime]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check idle-pachinko-shootout/sprite-v19.js
          node --check idle-pachinko-shootout/engine-v17.js
      - name: Sprite asset checks
        run: |
          test -s idle-pachinko-shootout/assets/sprites/sprites-v19.webp
          test $(stat -c%s idle-pachinko-shootout/assets/sprites/sprites-v19.webp) -gt 300000
          file idle-pachinko-shootout/assets/sprites/sprites-v19.webp | grep -qi webp
      - name: Entry-point checks
        run: |
          grep -q 'v1.9' idle-pachinko-shootout/index.html
          grep -q 'sprite-v19.css' idle-pachinko-shootout/index.html
          grep -q 'sprite-v19.js' idle-pachinko-shootout/index.html
          grep -q 'assets/sprites/sprites-v19.webp' idle-pachinko-shootout/sprite-v19.js
          grep -q "deadeye:6" idle-pachinko-shootout/sprite-v19.js
          grep -q "train:9" idle-pachinko-shootout/sprite-v19.js
