name: Lane Warden 3D-04
on:
  push:
    paths:
      - '.github/workflows/lane-warden-3d04.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unreliable imported actors with self-contained articulated rigs
        shell: python
        run: |
          from pathlib import Path
          p = Path('lane-warden-3d/index.html')
          s = p.read_text()
          if 'build 3D-04' in s:
              raise SystemExit(0)
          marker = 'function orientTo(root,a,b){'
          insert = r'''
          // 3D-04: use deterministic, self-contained articulated placeholder rigs.
          // The remote CC0 GLBs remain documented research assets, but this visual
          // proof no longer depends on mobile Safari interpreting those rigs.
          const rigUpdaters=[];
          const rigSteel=new THREE.MeshStandardMaterial({color:0x667386,metalness:.35,roughness:.48});
          const rigDark=new THREE.MeshStandardMaterial({color:0x28303c,roughness:.85});
          const rigBone=new THREE.MeshStandardMaterial({color:0xe5dec9,roughness:.78});
          function rigMesh(g,m){const x=new THREE.Mesh(g,m);x.castShadow=x.receiveShadow=true;return x}
          function rigLimb(w,h,d,m){const g=new THREE.Group(),x=rigMesh(new THREE.BoxGeometry(w,h,d),m);x.position.y=-h/2;g.add(x);return g}
          function knightRig(color){
            const team=new THREE.MeshStandardMaterial({color,roughness:.68}), r=new THREE.Group(), body=new THREE.Group();r.add(body);
            let x=rigMesh(new THREE.BoxGeometry(.72,.72,.48),rigDark);x.position.y=1.12;body.add(x);
            x=rigMesh(new THREE.BoxGeometry(1.12,.24,.62),team);x.position.y=1.48;body.add(x);
            x=rigMesh(new THREE.CylinderGeometry(.25,.29,.34,8),rigSteel);x.position.y=1.82;body.add(x);
            x=rigMesh(new THREE.BoxGeometry(.12,.22,.46),team);x.position.y=2.06;body.add(x);
            const la=new THREE.Group();la.position.set(-.55,1.43,0);body.add(la);la.add(rigLimb(.20,.62,.22,rigSteel));
            x=rigMesh(new THREE.BoxGeometry(.12,.82,.72),rigSteel);x.position.set(-.25,-.42,0);la.add(x);
            const ra=new THREE.Group();ra.position.set(.55,1.43,0);body.add(ra);ra.add(rigLimb(.19,.62,.20,rigSteel));
            x=rigMesh(new THREE.BoxGeometry(.10,.90,.12),rigSteel);x.position.set(.10,-.80,0);ra.add(x);
            const ll=new THREE.Group();ll.position.set(-.22,.82,0);body.add(ll);ll.add(rigLimb(.24,.78,.26,rigDark));
            const rl=new THREE.Group();rl.position.set(.22,.82,0);body.add(rl);rl.add(rigLimb(.24,.78,.26,rigDark));
            r.userData.rig={kind:'knight',la,ra,ll,rl,body,phase:Math.random()*6.28};return r;
          }
          function skeletonRig(color){
            const team=new THREE.MeshStandardMaterial({color,roughness:.72}),r=new THREE.Group(),body=new THREE.Group();r.add(body);
            let x=rigMesh(new THREE.BoxGeometry(.42,.20,.28),rigBone);x.position.y=.80;body.add(x);
            x=rigMesh(new THREE.BoxGeometry(.20,.66,.18),rigBone);x.position.y=1.20;body.add(x);
            x=rigMesh(new THREE.BoxGeometry(.62,.34,.20),rigBone);x.position.y=1.36;body.add(x);
            x=rigMesh(new THREE.SphereGeometry(.24,8,6),rigBone);x.position.y=1.78;body.add(x);
            x=rigMesh(new THREE.BoxGeometry(.11,.18,.36),team);x.position.y=2.02;body.add(x);
            const la=new THREE.Group();la.position.set(-.38,1.45,0);body.add(la);la.add(rigLimb(.13,.72,.13,rigBone));
            const ra=new THREE.Group();ra.position.set(.38,1.45,0);body.add(ra);ra.add(rigLimb(.13,.72,.13,rigBone));
            const ll=new THREE.Group();ll.position.set(-.16,.78,0);body.add(ll);ll.add(rigLimb(.14,.72,.14,rigBone));
            const rl=new THREE.Group();rl.position.set(.16,.78,0);body.add(rl);rl.add(rigLimb(.14,.72,.14,rigBone));
            x=rigMesh(new THREE.CylinderGeometry(.035,.035,1.55,6),rigSteel);x.position.set(.10,-.80,0);ra.add(x);
            r.userData.rig={kind:'skeleton',la,ra,ll,rl,body,phase:Math.random()*6.28};return r;
          }
          function batRig(color){
            const wm=new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,roughness:.76}),r=new THREE.Group();
            let x=rigMesh(new THREE.SphereGeometry(.25,8,6),rigDark);x.scale.set(1,1.35,1);r.add(x);
            const lw=new THREE.Group(),rw=new THREE.Group();lw.position.x=-.18;rw.position.x=.18;r.add(lw,rw);
            const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,-1.15,.05,.05,-.55,-.22,.12,0,0,0,-.55,-.22,.12,-.20,-.38,.03],3));geo.computeVertexNormals();
            lw.add(rigMesh(geo,wm));x=rigMesh(geo.clone(),wm);x.scale.x=-1;rw.add(x);
            r.userData.rig={kind:'bat',lw,rw,phase:Math.random()*6.28};return r;
          }
          function updateRig(v,t){const q=v.userData.rig;if(!q)return;const a=t*6+q.phase;if(q.kind==='knight'){let z=Math.sin(a)*.48;q.ll.rotation.x=z;q.rl.rotation.x=-z;q.la.rotation.x=-z*.55;q.ra.rotation.x=z*.7;q.body.position.y=Math.abs(Math.sin(a))*.035}else if(q.kind==='skeleton'){let z=Math.sin(a)*.58;q.ll.rotation.x=z;q.rl.rotation.x=-z;q.la.rotation.x=-z*.45;q.ra.rotation.x=z*.5}else{let z=.35+Math.sin(t*10+q.phase)*.55;q.lw.rotation.z=-z;q.rw.rotation.z=z}}
          spawnModel=function(type,color,height=1.3,marker=true){
            const visual=type==='knight'?knightRig(color):type==='bat'?batRig(color):skeletonRig(color);
            visual.scale.setScalar(height/(type==='bat'?.8:2.15));
            const root=new THREE.Group();root.add(visual);
            if(marker){const ring=new THREE.Mesh(new THREE.RingGeometry(.24,.31,28),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.34,side:THREE.DoubleSide,depthWrite:false}));ring.rotation.x=-Math.PI/2;ring.position.y=.025;root.add(ring)}
            scene.add(root);rigUpdaters.push(visual);return {root,visual,mixer:null};
          };
          status.textContent='Self-contained articulated placeholder rigs · build 3D-04';
          '''
          s = s.replace(marker, insert + '\n' + marker, 1)
          s = s.replace("  mixers.forEach(m=>m.update(dt));\n  movers.forEach(m=>m.update(dt));", "  const now=performance.now()/1000;\n  rigUpdaters.forEach(r=>updateRig(r,now));\n  movers.forEach(m=>m.update(dt));")
          s = s.replace('build 3D-03','build 3D-04')
          p.write_text(s)
      - name: Commit build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lane-warden-3d/index.html
          git diff --cached --quiet || git commit -m 'Replace Lane Warden actors with self-contained articulated rigs'
          git push
